name: コラム・お知らせ自動更新

# 【いつ動くか】
#  ・1日1回、日本時間の朝5時ごろに自動実行（公開台帳と Googleドキュメントの変更をサイトに反映）
#    ※ GitHub の混雑具合で、数分〜1時間ほど遅れることがあります
#  ・GitHub 上でサイトのファイルを直したとき（その内容を Xサーバーへ反映）
#  ・GitHub の「Actions」タブから手動実行（今すぐ反映したいとき）
on:
  schedule:
    # 時刻は世界標準時（UTC）で書きます。日本時間は +9時間。
    # '7 20 * * *' ＝ UTC 20:07 ＝ 日本時間 朝5:07（毎日）
    # 時刻を変えたいときは、2番目の数字（時）を「日本時間 − 9」に直します
    #   例）日本時間 朝7時 → '7 22 * * *'　／　日本時間 正午 → '7 3 * * *'
    - cron: '7 20 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # 前回の実行結果を調べるために必要

# 同時に2つ動かない（前の実行が終わってから次を実行）
concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 必要な部品をインストール
        run: npm ci --prefix column-system

      # 前回の実行が失敗していた場合は、今回かならず Xサーバーへ送り直す
      # （アップロードだけ失敗して、サイトが古いまま残るのを防ぐ）
      # 調べられなかったときも、念のため送り直す
      - name: 前回の実行が成功していたか確認
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          # このファイル自身の名前（例：update-column.yml）を取り出す
          file="${WORKFLOW_REF%@*}"
          file="${file##*/}"
          last=$(gh run list --workflow "$file" --status completed --limit 1 \
                   --json conclusion --jq '.[0].conclusion // "none"' 2>/dev/null || echo "unknown")
          echo "前回の実行結果：${last:-unknown}"
          if [ "$last" = "success" ]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
          else
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "前回が成功ではなかったため、今回は Xサーバーへ送り直します。"
          fi

      - name: 台帳とドキュメントから、コラム・お知らせを作り直す
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: node column-system/build.js

      - name: 変更があったか確認
        id: diff
        run: |
          # 自動生成される3か所だけを対象にする（column-img は画像のある記事が1つもなければ存在しない）
          git add -A -- index.html column.html
          git add -A -- column-img 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "変更はありませんでした。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: 変更を記録（コミット）
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "コラム・お知らせを自動更新"
          git push

      # Xサーバーへアップロード
      #  ・自動実行（1日1回）のときは、変更があった場合か、前回の実行が失敗していた場合だけ
      #  ・手動実行・ファイル修正のときは、必ず実行
      - name: Xサーバーへアップロード
        if: steps.diff.outputs.changed == 'true' || github.event_name != 'schedule' || steps.last.outputs.retry == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/column-system/**
            **/gas/**
            **/手順書/**
            **/*.md
